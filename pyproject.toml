[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pupil-track"
dynamic = ["version"]
description = "Python tool for pupil tracking and segmentation with U-Net architecture."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.5",
    "opencv-python>=4.8.0",
    "albumentations>=1.3.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "tqdm>=4.64.1",
    "Pillow>=9.3.0",
]

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
pupil-track = "pupil_track.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "pupil_track.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
